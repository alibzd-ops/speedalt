workflows:
  android-release:
    name: Hiz Olcer Android Release Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Run Unit & Widget Tests
        script: |
          flutter test
      - name: Build Android App Bundle (AAB)
        script: |
          BUILD_NUM=$(($BUILD_NUMBER + 5))
          flutter build appbundle --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUM
    artifacts:
      - build/**/outputs/bundle/**/*.aab
      - build/**/outputs/apk/**/*.apk

  ios-release:
    name: Hiz Olcer iOS Release Build (TestFlight)
    max_build_duration: 30
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_app_store
    environment:
      groups:
        - admob
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bzdstudio.hizolcer
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Configure AdMob app identifier if provided
        script: |
          if [ -n "$ADMOB_APP_ID" ]; then
            echo "Setting custom ADMOB_APP_ID in Info.plist"
            /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier $ADMOB_APP_ID" ios/Runner/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :GADApplicationIdentifier string $ADMOB_APP_ID" ios/Runner/Info.plist
          fi
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Run Unit & Widget Tests
        script: |
          flutter test
      - name: Build iOS IPA
        script: |
          BUILD_NUM=$(($BUILD_NUMBER + 5))
          echo "Building iOS IPA with build number: $BUILD_NUM"
          DART_DEFINES=""
          if [ -n "$ADMOB_BANNER_ID" ]; then
            DART_DEFINES="$DART_DEFINES --dart-define=ADMOB_IOS_BANNER_ID=$ADMOB_BANNER_ID"
          fi
          if [ -n "$ADMOB_INTERSTITIAL_ID" ]; then
            DART_DEFINES="$DART_DEFINES --dart-define=ADMOB_IOS_INTERSTITIAL_ID=$ADMOB_INTERSTITIAL_ID"
          fi
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUM \
            $DART_DEFINES \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
